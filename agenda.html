<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agenda · Plataforma POA AOCA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#2F2B84; --indigo-deep:#211D5E; --indigo-tint:#EDECFA;
    --orange:#FF7A00; --orange-tint:#FFEEDC;
    --green:#5BA646; --green-tint:#E8F4E3;
    --red:#C0392B; --red-tint:#FBE7E4;
    --paper:#F6F4EF; --ink:#1B1830; --ink-soft:#5C5876; --line:#DEDBEE;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:30px 20px 60px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--indigo-deep);transform:rotate(-6deg);}
  .brand span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--indigo-deep);}
  nav.links{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  nav.links a{font-size:12px;color:var(--ink-soft);text-decoration:none;border-bottom:2px solid transparent;padding-bottom:2px;}
  nav.links a.active{color:var(--indigo-deep);font-weight:600;border-color:var(--orange);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0 0 4px;color:var(--indigo-deep);}
  .hint{font-size:12px;color:var(--ink-soft);margin:0 0 20px;}
  .grupo{margin-bottom:22px;}
  .grupo h2{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 10px;}
  .item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:center;}
  .item.vencido{border-color:#F4C9C1;}
  .fecha-box{width:52px;flex-shrink:0;text-align:center;background:var(--indigo-tint);border-radius:9px;padding:6px 0;}
  .item.vencido .fecha-box{background:var(--red-tint);}
  .fecha-box .dia{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:var(--indigo-deep);line-height:1;}
  .item.vencido .fecha-box .dia{color:var(--red);}
  .fecha-box .mes{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-soft);text-transform:uppercase;}
  .info{flex:1;}
  .prog{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--orange);text-transform:uppercase;}
  .tt{font-size:13px;font-weight:600;margin:2px 0 3px;}
  .who{font-size:11px;color:var(--ink-soft);}
  .chip{font-size:10px;color:var(--indigo);background:var(--indigo-tint);padding:3px 8px;border-radius:999px;text-decoration:none;margin-left:6px;}
  .empty{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:30px;background:#fff;border:1px solid var(--line);border-radius:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">A</div><span>Plataforma POA · AOCA</span></div>
  <nav class="links">
    <a href="mis-tareas.html">Mis tareas</a>
    <a href="bitacora-semanal.html">Bitácora semanal</a>
    <a href="revision-lunes.html">Revisión de lunes</a>
    <a href="reportes.html">Reportes</a>
    <a href="muro.html">Muro</a>
    <a href="agenda.html" class="active">Agenda</a>
  </nav>

  <h1>Agenda del equipo</h1>
  <p class="hint">Fechas a tener en cuenta cargadas en las tareas de todo el equipo — reuniones, entregas, eventos. No es un plazo de vencimiento estricto.</p>

  <div id="contenido"><div class="empty">Cargando…</div></div>
</div>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz79-KdirXDLcDGQREVFWNzNfw-5R0W7H-VHEKw6IlT3Ziz7ZTawoCLYOfjWHad-DrC/exec';
const MESES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

async function cargar() {
  const cont = document.getElementById('contenido');
  try {
    const res = await fetch(WEBAPP_URL + '?action=agenda');
    const items = await res.json();
    if (!items.length) {
      cont.innerHTML = '<div class="empty">Todavía no hay fechas cargadas. Se agregan desde "Mis tareas" al crear una tarea nueva.</div>';
      return;
    }
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const grupos = { 'Vencidas': [], 'Esta semana': [], 'Próximamente': [] };
    items.forEach(it => {
      const f = new Date(it.fecha);
      const dias = Math.round((f - hoy) / 86400000);
      if (dias < 0) grupos['Vencidas'].push(it);
      else if (dias <= 7) grupos['Esta semana'].push(it);
      else grupos['Próximamente'].push(it);
    });

    cont.innerHTML = Object.keys(grupos).filter(g => grupos[g].length).map(g => `
      <div class="grupo">
        <h2>${g} (${grupos[g].length})</h2>
        ${grupos[g].map(it => {
          const f = new Date(it.fecha);
          const vencido = g === 'Vencidas';
          return `
          <div class="item ${vencido ? 'vencido' : ''}">
            <div class="fecha-box"><div class="dia">${f.getDate()}</div><div class="mes">${MESES[f.getMonth()]}</div></div>
            <div class="info">
              <div class="prog">${it.codigoPoa}</div>
              <div class="tt">${it.titulo}</div>
              <span class="who">${it.responsableEmail} · ${it.estado}</span>
              ${it.linkDrive ? `<a class="chip" href="${it.linkDrive}" target="_blank">🔗 Ver doc</a>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>
    `).join('');
  } catch (err) {
    cont.innerHTML = '<div class="empty">No se pudo cargar la agenda.</div>';
  }
}

cargar();
</script>
</body>
</html>
