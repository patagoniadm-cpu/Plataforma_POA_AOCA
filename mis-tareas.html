<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis tareas · Plataforma POA AOCA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#2F2B84; --indigo-deep:#211D5E; --indigo-tint:#EDECFA;
    --orange:#FF7A00; --orange-tint:#FFEEDC;
    --green:#5BA646; --green-tint:#E8F4E3;
    --paper:#F6F4EF; --ink:#1B1830; --ink-soft:#5C5876; --line:#DEDBEE;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:30px 20px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--indigo-deep);transform:rotate(-6deg);}
  .brand span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--indigo-deep);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0;color:var(--indigo-deep);}
  .who{font-size:12px;color:var(--ink-soft);}
  .who button{background:none;border:none;color:var(--orange);font-weight:600;cursor:pointer;font-size:12px;text-decoration:underline;padding:0;margin-left:6px;}
  .btn{border:none;border-radius:9px;padding:10px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Work Sans';}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px;}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .col{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:80px;}
  .col h3{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 8px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:12px;}
  .card .prog{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--orange);text-transform:uppercase;margin-bottom:3px;}
  .card .who2{font-size:10px;color:var(--ink-soft);margin-top:6px;}
  .card a{color:var(--indigo);text-decoration:none;font-size:10.5px;}
  .empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);font-size:12.5px;padding:20px;}
  .overlay{position:fixed;inset:0;background:rgba(27,24,48,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:24px;width:420px;max-width:100%;max-height:90vh;overflow:auto;}
  .modal h3{font-family:'Space Grotesk',sans-serif;margin:0 0 4px;color:var(--indigo-deep);}
  .field{margin-bottom:12px;}
  .field label{font-size:11px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .field select, .field input, .field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:'Work Sans';font-size:12.5px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  #toast{position:fixed;bottom:24px;right:24px;left:24px;background:var(--indigo-deep);color:#fff;padding:14px 18px;border-radius:10px;font-size:12.5px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:360px;margin-left:auto;}
  #toast.show{display:block;}
  #toast.err{background:#C0392B;}
  @media(max-width:760px){.board{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="mark">A</div><span>Plataforma POA · AOCA</span></div>
    <button class="btn btn-primary" onclick="toggleModal(true)">+ Nueva tarea</button>
  </div>

  <h1>Mis tareas</h1>
  <p class="who">Ingresaste como <b id="emailActual">—</b><button onclick="cambiarUsuario()">cambiar</button></p>

  <div class="panel">
    <div class="board" id="board">
      <div class="empty">Cargando tus tareas…</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Nueva tarea</h3>
    <div class="field"><label>Programa / Acción del POA</label>
      <select id="fCodigo"><option>Cargando…</option></select>
    </div>
    <div class="field"><label>Título de la tarea</label><input id="fTitulo" type="text" placeholder="Ej: Enviar propuesta a auspiciantes"></div>
    <div class="field"><label>Descripción (opcional)</label><textarea id="fDescripcion" rows="2"></textarea></div>
    <div class="field"><label>Link al documento en Drive (opcional)</label><input id="fLink" type="text" placeholder="https://drive.google.com/..."></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="toggleModal(false)">Cancelar</button>
      <button class="btn btn-primary" onclick="crearTarea()">Guardar tarea</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ======= CONFIGURACIÓN =======
// Pegar acá la URL que termina en /exec, obtenida al Implementar el Apps Script
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz79-KdirXDLcDGQREVFWNzNfw-5R0W7H-VHEKw6IlT3Ziz7ZTawoCLYOfjWHad-DrC/exec';
// ==============================

let emailActual = localStorage.getItem('aoca_email');
let programasCache = [];

function init() {
  if (!emailActual) { cambiarUsuario(); return; }
  document.getElementById('emailActual').textContent = emailActual;
  cargarProgramas();
  cargarMisTareas();
}

function cambiarUsuario() {
  const email = prompt('Ingresá tu email de AOCA (ej: candela@aoca.org.ar):', emailActual || '');
  if (email) {
    emailActual = email.trim();
    localStorage.setItem('aoca_email', emailActual);
    document.getElementById('emailActual').textContent = emailActual;
    cargarMisTareas();
  }
}

async function cargarProgramas() {
  try {
    const res = await fetch(WEBAPP_URL + '?action=programas');
    programasCache = await res.json();
    const sel = document.getElementById('fCodigo');
    sel.innerHTML = programasCache.map(p =>
      `<option value="${p.Codigo}">${p.Codigo} — ${p.Descripcion || p.Programa}</option>`
    ).join('');
  } catch (err) {
    showToast('No se pudo cargar la lista del POA. Revisá la URL configurada.', true);
  }
}

async function cargarMisTareas() {
  const board = document.getElementById('board');
  board.innerHTML = '<div class="empty">Cargando tus tareas…</div>';
  try {
    const res = await fetch(WEBAPP_URL + '?action=misTareas&email=' + encodeURIComponent(emailActual));
    const tareas = await res.json();
    renderBoard(tareas);
  } catch (err) {
    board.innerHTML = '<div class="empty">No se pudieron cargar las tareas. Revisá la URL configurada.</div>';
  }
}

function renderBoard(tareas) {
  const columnas = { 'Pendiente': [], 'En curso': [], 'Bloqueada': [], 'Completada': [] };
  tareas.forEach(t => {
    const col = columnas[t.estado] ? t.estado : 'Pendiente';
    columnas[col].push(t);
  });
  const board = document.getElementById('board');
  board.innerHTML = Object.keys(columnas).map(nombreCol => `
    <div class="col">
      <h3>${nombreCol} (${columnas[nombreCol].length})</h3>
      ${columnas[nombreCol].map(t => `
        <div class="card">
          <div class="prog">${t.codigo_poa}</div>
          ${t.titulo}
          ${t.link_drive ? `<div class="who2"><a href="${t.link_drive}" target="_blank">🔗 Ver doc</a></div>` : ''}
        </div>
      `).join('') || '<div style="font-size:11px;color:var(--ink-soft)">Sin tareas</div>'}
    </div>
  `).join('');
}

function toggleModal(show) { document.getElementById('overlay').classList.toggle('show', show); }

async function crearTarea() {
  const titulo = document.getElementById('fTitulo').value.trim();
  if (!titulo) { showToast('Poné un título para la tarea.', true); return; }
  const datos = {
    codigoPoa: document.getElementById('fCodigo').value,
    titulo: titulo,
    descripcion: document.getElementById('fDescripcion').value,
    responsableEmail: emailActual,
    linkDrive: document.getElementById('fLink').value
  };
  try {
    await fetch(WEBAPP_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'guardarTarea', datos })
    });
    toggleModal(false);
    showToast('✓ Tarea guardada y vinculada al POA.');
    document.getElementById('fTitulo').value = '';
    document.getElementById('fDescripcion').value = '';
    document.getElementById('fLink').value = '';
    cargarMisTareas();
  } catch (err) {
    showToast('No se pudo guardar la tarea.', true);
  }
}

function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 3500);
}

init();
</script>
</body>
</html>
