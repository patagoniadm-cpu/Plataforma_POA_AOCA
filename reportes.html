<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reportes · Plataforma POA AOCA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#2F2B84; --indigo-deep:#211D5E; --indigo-tint:#EDECFA;
    --orange:#FF7A00; --orange-tint:#FFEEDC;
    --green:#5BA646; --green-tint:#E8F4E3;
    --paper:#F6F4EF; --ink:#1B1830; --ink-soft:#5C5876; --line:#DEDBEE;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;}
  .wrap{max-width:820px;margin:0 auto;padding:30px 20px 60px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--indigo-deep);transform:rotate(-6deg);}
  .brand span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--indigo-deep);}
  nav.links{display:flex;gap:14px;margin-bottom:22px;}
  nav.links a{font-size:12px;color:var(--ink-soft);text-decoration:none;border-bottom:2px solid transparent;padding-bottom:2px;}
  nav.links a.active{color:var(--indigo-deep);font-weight:600;border-color:var(--orange);}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--orange);letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0;color:var(--indigo-deep);}
  .btn{border:none;border-radius:9px;padding:10px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Work Sans';background:var(--orange);color:#fff;}
  .btn:disabled{opacity:.5;}
  .headline{background:linear-gradient(120deg,var(--indigo) 0%,var(--indigo-deep) 100%);color:#fff;border-radius:16px;padding:22px 24px;margin-bottom:22px;}
  .headline p{font-family:'Space Grotesk',sans-serif;font-size:16px;line-height:1.5;margin:0;}
  .headline b{color:var(--orange);}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .badge{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden;}
  .badge::before{content:"";position:absolute;top:0;bottom:0;left:0;width:5px;background:var(--accent,var(--indigo));}
  .badge .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);}
  .badge .val{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-top:3px;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px;}
  .panel h2{font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0 0 14px;color:var(--indigo-deep);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .bar-row .name{width:150px;font-size:12px;flex-shrink:0;}
  .bar-track{flex:1;height:9px;background:var(--indigo-tint);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;}
  .bar-row .pct{width:34px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .contrib{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .contrib:last-child{border:none;}
  .empty{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:20px;}
  #toast{position:fixed;bottom:24px;right:24px;left:24px;background:var(--indigo-deep);color:#fff;padding:14px 18px;border-radius:10px;font-size:12.5px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:360px;margin-left:auto;}
  #toast.show{display:block;}
  #toast a{color:#fff;text-decoration:underline;}
  @media(max-width:700px){.kpis{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">A</div><span>Plataforma POA · AOCA</span></div>
  <nav class="links">
    <a href="mis-tareas.html">Mis tareas</a>
    <a href="bitacora-semanal.html">Bitácora semanal</a>
    <a href="revision-lunes.html">Revisión de lunes</a>
    <a href="reportes.html" class="active">Reportes</a>
  </nav>

  <div class="topbar">
    <div><p class="eyebrow" id="semanaLbl">Semana —</p><h1>Reporte de avance</h1></div>
    <button class="btn" id="btnExport" onclick="exportar()">⤓ Exportar PDF</button>
  </div>

  <div id="contenido"><div class="empty">Cargando datos…</div></div>
</div>

<div id="toast"></div>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz79-KdirXDLcDGQREVFWNzNfw-5R0W7H-VHEKw6IlT3Ziz7ZTawoCLYOfjWHad-DrC/exec';

function semanaISO(d) {
  const date = new Date(d.getTime());
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7));
  const week1 = new Date(date.getFullYear(), 0, 4);
  const semanaNum = 1 + Math.round(((date - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return date.getFullYear() + '-W' + String(semanaNum).padStart(2, '0');
}
const semana = semanaISO(new Date());
const colores = ['var(--green)', 'var(--orange)', '#C0392B'];

async function cargar() {
  document.getElementById('semanaLbl').textContent = 'Semana ' + semana;
  const cont = document.getElementById('contenido');
  try {
    const res = await fetch(WEBAPP_URL + '?action=resumen&semana=' + semana);
    const r = await res.json();

    let headline;
    if (r.porPrograma.length) {
      const top = r.porPrograma[0];
      const bottom = r.porPrograma[r.porPrograma.length - 1];
      headline = `El avance promedio del equipo es <b>${r.avancePromedio}%</b>. El programa más avanzado es <b>${top.programa}</b> (${top.avance}%)${r.porPrograma.length > 1 ? `; el que más necesita atención es <b>${bottom.programa}</b> (${bottom.avance}%)` : ''}.`;
    } else {
      headline = 'Todavía no hay tareas cargadas para calcular un resumen. Empezá cargando algunas desde "Mis tareas".';
    }

    cont.innerHTML = `
      <div class="headline"><p>${headline}</p></div>
      <div class="kpis">
        <div class="badge" style="--accent:var(--indigo)"><p class="lbl">Avance promedio</p><p class="val">${r.avancePromedio}%</p></div>
        <div class="badge" style="--accent:var(--green)"><p class="lbl">Tareas completadas</p><p class="val">${r.tareasCompletadas}</p></div>
        <div class="badge" style="--accent:var(--orange)"><p class="lbl">Tareas activas</p><p class="val">${r.tareasActivas}</p></div>
        <div class="badge" style="--accent:#C0392B"><p class="lbl">Requerimientos abiertos</p><p class="val">${r.requerimientosAbiertos}</p></div>
      </div>
      <div class="panel">
        <h2>Avance por programa</h2>
        ${r.porPrograma.length ? r.porPrograma.map((p, i) => `
          <div class="bar-row">
            <span class="name">${p.programa}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${p.avance}%;background:${p.avance>=70?'var(--green)':p.avance>=40?'var(--orange)':'#C0392B'}"></div></div>
            <span class="pct">${p.avance}%</span>
          </div>
        `).join('') : '<div class="empty">Sin datos todavía</div>'}
      </div>
      <div class="panel">
        <h2>Aporte del equipo esta semana</h2>
        ${r.porPersona.length ? r.porPersona.map(p => `
          <div class="contrib"><span>${p.email}</span><span>${p.cantidad} avance(s) cargado(s)</span></div>
        `).join('') : '<div class="empty">Todavía nadie cargó su bitácora esta semana</div>'}
      </div>
    `;
  } catch (err) {
    cont.innerHTML = '<div class="empty">No se pudieron cargar los datos. Revisá la conexión.</div>';
  }
}

async function exportar() {
  const btn = document.getElementById('btnExport');
  btn.disabled = true;
  btn.textContent = 'Generando…';
  try {
    const res = await fetch(WEBAPP_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'exportarReporteEquipo', datos: { semana } })
    });
    const data = await res.json();
    if (data.error) {
      showToast('Error al generar el PDF: ' + data.error);
    } else {
      showToast('✓ PDF generado. <a href="' + data.url + '" target="_blank">Abrir en Drive</a>');
    }
  } catch (err) {
    showToast('No se pudo generar el PDF.');
  }
  btn.disabled = false;
  btn.textContent = '⤓ Exportar PDF';
}

function showToast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = html;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 6000);
}

cargar();
</script>
</body>
</html>
