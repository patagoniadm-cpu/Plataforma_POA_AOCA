<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Requerimientos · Plataforma POA AOCA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#2F2B84; --indigo-deep:#1A1760; --indigo-tint:#EDECFA;
    --orange:#FF7A00; --orange-tint:#FFEEDC;
    --turquesa:#00D2D1; --turquesa-tint:#E0FAF9;
    --red:#C0392B; --red-tint:#FBE7E4;
    --paper:#F6F4EF; --ink:#1B1830; --ink-soft:#5C5876; --line:#DEDBEE;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Montserrat',sans-serif;}
  .wrap{max-width:800px;margin:0 auto;padding:30px 20px 60px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:700;color:var(--indigo-deep);transform:rotate(-6deg);}
  .brand span{font-weight:700;font-size:16px;color:var(--indigo-deep);}
  h1{font-size:22px;font-weight:800;margin:0 0 4px;color:var(--indigo-deep);}
  .hint{font-size:12px;color:var(--ink-soft);margin:0 0 20px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .tab.on{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
  .card.resuelto{opacity:.6;}
  .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .tipo-badge{font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
  .tipo-badge.Necesidad{background:var(--indigo-tint);color:var(--indigo);}
  .tipo-badge.Definición{background:var(--turquesa-tint);color:#0B8A89;}
  .tipo-badge.Bloqueo{background:var(--red-tint);color:var(--red);}
  .meta{font-size:10.5px;color:var(--ink-soft);}
  .quien{font-size:12.5px;font-weight:700;color:var(--indigo-deep);margin:8px 0 2px;}
  .desc{font-size:12.5px;line-height:1.5;margin:0 0 10px;}
  .estado-badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .estado-badge.Pendiente{background:var(--red-tint);color:var(--red);}
  .estado-badge.En.análisis{background:var(--orange-tint);color:var(--orange);}
  .estado-badge.Resuelto{background:var(--turquesa-tint);color:#0B8A89;}
  .respuesta{background:var(--paper);border-radius:8px;padding:10px 12px;font-size:12px;margin-top:8px;}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .btn{border:none;border-radius:8px;padding:8px 13px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:'Montserrat';}
  .btn-turq{background:var(--turquesa);color:#023331;}
  .btn-orange{background:var(--orange);color:#fff;}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  textarea.resp{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:'Montserrat';font-size:12px;min-height:44px;margin-top:8px;display:none;}
  .empty{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:30px;background:#fff;border:1px solid var(--line);border-radius:14px;}
  #toast{position:fixed;bottom:24px;right:24px;left:24px;background:var(--indigo-deep);color:#fff;padding:14px 18px;border-radius:10px;font-size:12.5px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:360px;margin-left:auto;}
  #toast.show{display:block;}
  #toast.err{background:#C0392B;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">A</div><span>Plataforma POA · AOCA</span></div>
  <nav class="app-nav">
    <a href="index.html">🏠 Inicio</a>
    <a href="mis-tareas.html">Mis tareas</a>
    <a href="bitacora-semanal.html">Bitácora semanal</a>
    <a href="revision-lunes.html">Revisión de lunes</a>
    <a href="reportes.html">Reportes</a>
    <a href="muro.html">Muro</a>
    <a href="agenda.html">Agenda</a>
    <a href="requerimientos.html">Requerimientos</a>
  </nav>

  <h1>Requerimientos</h1>
  <p class="hint">Necesidades, definiciones y bloqueos que el equipo fue cargando. Marcalos como resueltos cuando corresponda.</p>

  <div class="tabs">
    <button class="tab on" data-filtro="pendientes" onclick="cambiarTab(this,'pendientes')">Pendientes</button>
    <button class="tab" data-filtro="todos" onclick="cambiarTab(this,'todos')">Todos</button>
  </div>

  <div id="lista"><div class="empty">Cargando…</div></div>
</div>

<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js" defer></script>
<div id="toast"></div>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz79-KdirXDLcDGQREVFWNzNfw-5R0W7H-VHEKw6IlT3Ziz7ZTawoCLYOfjWHad-DrC/exec';
let miEmail = localStorage.getItem('aoca_email') || prompt('Tu email (para registrar quién revisó):', 'direccionejecutiva@aoca.org.ar');
if (miEmail) localStorage.setItem('aoca_email', miEmail);

let todosLosRequerimientos = [];
let filtroActual = 'pendientes';

async function cargar() {
  const lista = document.getElementById('lista');
  lista.innerHTML = '<div class="empty">Cargando…</div>';
  try {
    const res = await fetch(WEBAPP_URL + '?action=requerimientos');
    todosLosRequerimientos = await res.json();
    render();
  } catch (err) {
    lista.innerHTML = '<div class="empty">No se pudieron cargar los requerimientos.</div>';
  }
}

function cambiarTab(btn, filtro) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  filtroActual = filtro;
  render();
}

function render() {
  const lista = document.getElementById('lista');
  const items = filtroActual === 'pendientes'
    ? todosLosRequerimientos.filter(r => r.estado !== 'Resuelto')
    : todosLosRequerimientos;

  if (!items.length) {
    lista.innerHTML = '<div class="empty">' + (filtroActual === 'pendientes' ? 'No hay requerimientos pendientes. 🎉' : 'Todavía no se cargó ningún requerimiento.') + '</div>';
    return;
  }

  lista.innerHTML = items.map((r, idx) => `
    <div class="card ${r.estado === 'Resuelto' ? 'resuelto' : ''}" id="req-${idx}">
      <div class="top2">
        <span class="tipo-badge ${r.tipo}">${r.tipo}</span>
        <span class="meta">${r.fecha}${r.tituloTarea ? ' · ' + r.tituloTarea : ''}</span>
      </div>
      <div class="quien">${r.solicitanteEmail}</div>
      <p class="desc">${r.descripcion}</p>
      <span class="estado-badge ${r.estado.replace(' ', '.')}">${r.estado}</span>
      ${r.respuestaDE ? `<div class="respuesta"><b>Respuesta:</b> ${r.respuestaDE}</div>` : ''}
      ${r.estado !== 'Resuelto' ? `
        <div class="actions">
          <button class="btn btn-ghost" onclick="toggleResp(${idx})">✎ Responder</button>
          <button class="btn btn-orange" onclick="cambiarEstado('${r.idRequerimiento}', 'En análisis', ${idx})">En análisis</button>
          <button class="btn btn-turq" onclick="cambiarEstado('${r.idRequerimiento}', 'Resuelto', ${idx})">✓ Marcar resuelto</button>
        </div>
        <textarea class="resp" id="resp-${idx}" placeholder="Escribí una respuesta (opcional)..."></textarea>
        <div class="actions" id="respActions-${idx}" style="display:none;">
          <button class="btn btn-ghost" onclick="guardarSoloRespuesta('${r.idRequerimiento}', '${r.estado}', ${idx})">💬 Guardar respuesta (sin cambiar estado)</button>
        </div>
      ` : ''}
    </div>
  `).join('');
}

function toggleResp(idx) {
  const t = document.getElementById('resp-' + idx);
  const abrir = t.style.display !== 'block';
  t.style.display = abrir ? 'block' : 'none';
  document.getElementById('respActions-' + idx).style.display = abrir ? 'flex' : 'none';
  if (abrir) t.focus();
}

async function guardarSoloRespuesta(idRequerimiento, estadoActual, idx) {
  const respEl = document.getElementById('resp-' + idx);
  const respuestaDE = respEl.value.trim();
  if (!respuestaDE) { showToast('Escribí algo antes de guardar.', true); return; }
  try {
    await fetch(WEBAPP_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'resolverRequerimiento', datos: { idRequerimiento, estado: estadoActual, respuestaDE } })
    });
    showToast('✓ Respuesta guardada.');
    cargar();
  } catch (err) {
    showToast('No se pudo guardar la respuesta.', true);
  }
}

async function cambiarEstado(idRequerimiento, estado, idx) {
  const respEl = document.getElementById('resp-' + idx);
  const respuestaDE = respEl ? respEl.value.trim() : '';
  try {
    await fetch(WEBAPP_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'resolverRequerimiento', datos: { idRequerimiento, estado, respuestaDE } })
    });
    showToast('✓ Actualizado a "' + estado + '".');
    cargar();
  } catch (err) {
    showToast('No se pudo actualizar.', true);
  }
}

function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 3500);
}

cargar();
</script>
</body>
</html>
